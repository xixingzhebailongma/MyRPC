name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.san }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # TSAN 不进 CI：系统 libgrpc / etcd-cpp-apiv3（未按 TSAN 构建）+ std::condition_variable
        # wait 谓词会产生大量假阳性（已核实 test_watch_incremental 两侧同持一个 mutex 仍报 race，
        # 且 ASan 无 use-after-free）。TSAN 改在本机跑：./scripts/run_sanitizers.sh tsan。
        san: [asan, ubsan]

    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.5.16
        ports:
          - 2379:2379
        env:
          ETCD_NAME: "default"
          ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
          ETCD_ADVERTISE_CLIENT_URLS: "http://127.0.0.1:2379"
          ETCD_LISTEN_PEER_URLS: "http://127.0.0.1:2380"
          ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://127.0.0.1:2380"
          ETCD_INITIAL_CLUSTER: "default=http://127.0.0.1:2380"
          ETCD_INITIAL_CLUSTER_STATE: "new"
        # etcd 官方镜像（distroless）无 shell，跑不了 string 形式的 --health-cmd；
        # 改为 runner 侧 curl /health 探活（见「等待 etcd 就绪」步骤）。

      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      RPC_TEST_ETCD_BIN: /tmp/myrpc-ci-etcd/etcd
      RPC_TEST_ETCDCTL_BIN: /tmp/myrpc-ci-etcd/etcdctl
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/lsan.supp
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/tsan.supp

    steps:
      - uses: actions/checkout@v4

      - name: TSAN 关闭 ASLR 熵（CI 内核 mmap_rnd_bits 过高会报 unexpected memory mapping）
        if: matrix.san == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: 安装依赖（版本钉死）
        run: ./scripts/install_deps.sh

      - name: 等待 etcd 就绪
        run: |
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:2379/health 2>/dev/null | grep -q true && { echo "etcd ready"; exit 0; }
            sleep 2
          done
          echo "etcd 未就绪" >&2
          exit 1

      - name: 应用 MySQL schema（带重试等容器就绪）
        run: |
          for i in $(seq 1 30); do
            mysql -h127.0.0.1 -uroot < apps/im/common/db/schema.sql 2>/dev/null && { echo "schema ok"; exit 0; }
            sleep 2
          done
          echo "mysql 未就绪" >&2
          exit 1

      - name: 配置 (${{ matrix.san }})
        env:
          SAN: ${{ matrix.san }}
        run: cmake -B "build/$SAN" "-DENABLE_${SAN^^}=ON" -DCMAKE_BUILD_TYPE=Debug

      - name: 编译
        env:
          SAN: ${{ matrix.san }}
        run: cmake --build "build/$SAN" -j"$(nproc)"

      # test_watch_incremental 的 teardown 挂死已修：etcd-cpp-apiv3 打补丁让
      # Watcher::CancelWatch() 可靠打断 waitForResponse（见 scripts/patches/）。
      - name: 单元测试（排除 3 个 IM E2E）
        env:
          SAN: ${{ matrix.san }}
        run: ctest --test-dir "build/$SAN" --output-on-failure --timeout 120 -E 'test_im_e2e|test_im_business|test_im_multi_node'

      - name: 清理 Redis 投递流
        run: redis-cli -p 6379 DEL im:delivery || true

      - name: IM 端到端（e2e + business + multi-node，串行）
        env:
          SAN: ${{ matrix.san }}
        run: ctest --test-dir "build/$SAN" --output-on-failure --timeout 300 -R 'test_im_e2e|test_im_business|test_im_multi_node'

  # 容器化验证：构建五个服务镜像 + 跑 docker compose 端到端 smoke test。
  # 未接 GHCR push / 服务器部署（最小可用，不做完整 CD）。
  container:
    name: 容器化（docker build + smoke test）
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像 + 端到端 smoke test
        run: ./scripts/smoke_test.sh

  # etcd-cpp-apiv3 fresh 构建（v0.15.3 + 补丁）在运行时崩溃（auth SIGSEGV，exit 139），
  # known issue。用 full profile 复现，continue-on-error 不阻塞合并；根因与修复方向见
  # docs/containerization.md「已知问题」。
  etcd-fresh-build:
    name: etcd-cpp-apiv3 fresh 构建（full 栈，known issue）
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 构建 full 栈 + 尝试起（auth 已知 SIGSEGV）
        run: |
          docker compose --profile full build
          docker compose --profile full up -d
          sleep 30
          echo "=== 服务状态 ==="
          docker compose ps
          echo "=== auth 日志（预期崩溃）==="
          docker compose logs auth --no-color || true
          docker compose down -v || true
