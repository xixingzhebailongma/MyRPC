name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.san }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        san: [asan, tsan, ubsan]

    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.5.16
        ports:
          - 2379:2379
        env:
          ETCD_NAME: "default"
          ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
          ETCD_ADVERTISE_CLIENT_URLS: "http://127.0.0.1:2379"
          ETCD_LISTEN_PEER_URLS: "http://127.0.0.1:2380"
          ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://127.0.0.1:2380"
          ETCD_INITIAL_CLUSTER: "default=http://127.0.0.1:2380"
          ETCD_INITIAL_CLUSTER_STATE: "new"
        options: >-
          --health-cmd "etcdctl endpoint health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      RPC_TEST_ETCD_BIN: /tmp/myrpc-ci-etcd/etcd
      RPC_TEST_ETCDCTL_BIN: /tmp/myrpc-ci-etcd/etcdctl
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - uses: actions/checkout@v4

      - name: TSAN 关闭 ASLR 熵（CI 内核 mmap_rnd_bits 过高会报 unexpected memory mapping）
        if: matrix.san == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: 安装依赖（版本钉死）
        run: ./scripts/install_deps.sh

      - name: 应用 MySQL schema（带重试等容器就绪）
        run: |
          for i in $(seq 1 30); do
            mysql -h127.0.0.1 -uroot < apps/im/common/db/schema.sema ok"; exit 0; }
            sleep 2
          done
          echo "mysql 未就绪" >&2
          exit 1

      - name: 配置 (${{ matrix.san }})
        env:
          SAN: ${{ matrix.san }}
        run: cmake -B "build/$SAN" "-DENABLE_${SAN^^}=ON" -DCMAKE_BUILD_TYPE=Debug

      - name: 编译
        env:
          SAN: ${{ matrix.san }}
        run: cmake --build "build/$SAN" -j"$(nproc)"

      - name: 单元测试（排除 3 个 IM E2E）
        env:
          SAN: ${{ matrix.san }}
        run: ctest --test-dir "build/$SAN" --output-on-failure -E 'test_im_e2e|test_im_business|test_im_multi_node'

      - name: 清理 Redis 投递流
        run: redis-cli -p 6379 DEL im:delivery || true

      - name: IM 端到端（e2e + business + multi-node，串行）
        env:
          SAN: ${{ matrix.san }}
        run: ctest --test-dir "build/$SAN" --output-on-failure -Rs|test_im_multi_node'
